<!--
  App: sample-test
  Created: 2026-08-17
  Description: 動作確認用のサンプルアプリ。現在の日時を表示し、カウントボタンで
  数字を1ずつ増やす。カウント値はlocalStorageに保存され、次回開いても保持される。
-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サンプルアプリ</title>
<script>const CONFIG = { apiBase: "", basePath: "" };</script>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f2f4f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Yu Gothic", sans-serif;
    color: #1f2933;
    padding: 16px;
  }
  .card {
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    padding: 32px 24px;
    width: 100%;
    max-width: 400px;
    text-align: center;
  }
  h1 {
    margin: 0 0 24px;
    font-size: 1.6rem;
  }
  .datetime {
    font-size: 0.95rem;
    color: #52606d;
    margin-bottom: 32px;
  }
  .count {
    font-size: 3rem;
    font-weight: bold;
    margin-bottom: 24px;
    color: #2563eb;
  }
  button {
    font-size: 1.1rem;
    padding: 12px 32px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: #fff;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover {
    background: #1d4ed8;
  }
  button:active {
    background: #1e40af;
  }
  .reset {
    display: block;
    margin: 16px auto 0;
    background: none;
    color: #9aa5b1;
    font-size: 0.85rem;
    padding: 6px 12px;
  }
  .reset:hover {
    background: #f0f1f3;
    color: #52606d;
  }
  @media (max-width: 600px) {
    .card {
      padding: 24px 16px;
    }
    h1 {
      font-size: 1.4rem;
    }
    .count {
      font-size: 2.4rem;
    }
    button {
      width: 100%;
    }
  }
</style>
</head>
<body>
<div class="card">
  <h1>サンプルアプリ</h1>
  <div class="datetime" id="datetime"></div>
  <div class="count" id="count">0</div>
  <button id="countBtn">カウント</button>
  <button class="reset" id="resetBtn">リセット</button>
</div>

<script>
  const STORAGE_KEY = "sample-test:count";

  function saveState(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function loadState() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return { count: 0 };
    try {
      return JSON.parse(raw);
    } catch (e) {
      return { count: 0 };
    }
  }

  function updateDatetime() {
    const now = new Date();
    const formatted = now.toLocaleString("ja-JP", {
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit"
    });
    document.getElementById("datetime").textContent = formatted;
  }

  let state = loadState();
  const countEl = document.getElementById("count");

  function render() {
    countEl.textContent = state.count;
  }

  document.getElementById("countBtn").addEventListener("click", function () {
    state.count += 1;
    saveState(state);
    render();
  });

  document.getElementById("resetBtn").addEventListener("click", function () {
    state.count = 0;
    saveState(state);
    render();
  });

  render();
  updateDatetime();
  setInterval(updateDatetime, 1000);
</script>
</body>
</html>
