<!--
  App: vein-treatment-record
  Created: 2026-07-20
  Description: 下肢静脈瘤レーザー治療(EVLA)・TLA麻酔の術中記録入力フォーム。
               iPad/iPhoneでのタップ入力を想定した単一HTMLアプリ。
               データはブラウザのlocalStorageに保存される(サーバー送信なし)。
-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>静脈瘤治療記録</title>
<script>const CONFIG = { apiBase: "", basePath: "" };</script>
<style>
  :root{
    --bg:#F7F6F3;
    --card:#FFFFFF;
    --ink:#1E2430;
    --ink-soft:#5B6472;
    --line:#E4E1DA;
    --accent:#D9772E;
    --accent-soft:#FCE9D8;
    --accent-ink:#7A3F0F;
    --danger:#C0432C;
    --ok:#3E7C5A;
    --radius:10px;
    --side-l:#2C6E9B;
    --side-r:#9B5A2C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Segoe UI",sans-serif;
    -webkit-tap-highlight-color:transparent;
    padding-bottom:90px;
  }
  header{
    position:sticky;top:0;z-index:20;
    background:var(--ink);
    color:#fff;
    padding:14px 16px;
    display:flex;align-items:center;justify-content:space-between;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.02em;}
  header .meta{font-size:11px;color:#C9CDD3;}
  .wrap{max-width:900px;margin:0 auto;padding:14px;}
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
  }
  .card h2{
    font-size:13px;
    margin:0 0 12px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:.08em;
    display:flex;align-items:center;justify-content:space-between;
  }
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:11px;color:var(--ink-soft);font-weight:600;}
  input[type=text],input[type=number],input[type=time],textarea{
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 10px;
    font-size:16px;
    color:var(--ink);
    background:#fff;
    width:100%;
    font-family:inherit;
  }
  input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent);}
  textarea{min-height:90px;resize:vertical;}
  .row{display:flex;gap:8px;align-items:flex-end;}
  .btn{
    border:none;border-radius:8px;
    padding:10px 14px;
    font-size:13px;font-weight:700;
    cursor:pointer;
    white-space:nowrap;
  }
  .btn-accent{background:var(--accent);color:#fff;}
  .btn-accent:active{background:var(--accent-ink);}
  .btn-outline{background:#fff;border:1px solid var(--line);color:var(--ink);}
  .btn-danger{background:transparent;color:var(--danger);font-size:18px;padding:4px 8px;}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
  .side-split{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .side{border-radius:8px;padding:10px;background:#FBFAF8;border:1px solid var(--line);}
  .side.left{border-top:3px solid var(--side-l);}
  .side.right{border-top:3px solid var(--side-r);}
  .side h3{font-size:12px;margin:0 0 8px;color:var(--ink-soft);font-weight:700;}
  .timeline-item{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .timeline-item label{flex:0 0 82px;font-size:12px;color:var(--ink-soft);}
  .timeline-item input{flex:1;}
  .med-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
  .med-row input{flex:1;}
  .three-vals{display:flex;gap:6px;}
  .three-vals input{width:100%;text-align:center;}
  footer-bar{display:none;}
  .fixed-actions{
    position:fixed;left:0;right:0;bottom:0;
    background:#fff;border-top:1px solid var(--line);
    padding:10px 14px;
    display:flex;gap:10px;
    z-index:30;
    box-shadow:0 -2px 10px rgba(0,0,0,.06);
  }
  .fixed-actions .btn{flex:1;}
  .toast{
    position:fixed;left:50%;bottom:80px;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;
    font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;
    z-index:50;
  }
  .toast.show{opacity:1;}
  .records-list{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;}
  .records-list .rec{
    padding:10px 12px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;font-size:13px;
    cursor:pointer;
  }
  .records-list .rec:last-child{border-bottom:none;}
  .records-list .rec small{color:var(--ink-soft);display:block;}
  .collapsible-body{display:none;margin-top:10px;}
  .collapsible-body.open{display:block;}
  .toggle-btn{font-size:12px;padding:6px 10px;}
  @media print{
    header,.fixed-actions,.toast{display:none !important;}
    body{padding:0;background:#fff;}
    .card{border:1px solid #999;break-inside:avoid;}
  }

  /* ---------- スマートフォン向けレイアウト ---------- */
  @media (max-width: 600px){
    .wrap{padding:10px;}
    .card{padding:12px;margin-bottom:10px;}
    .card h2{font-size:12px;margin-bottom:10px;flex-wrap:wrap;gap:6px;}
    header{padding:12px;}
    header h1{font-size:14px;}

    /* 左右2カラムを縦積みに */
    .side-split{grid-template-columns:1fr;gap:10px;}

    .grid{grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;}

    .row{flex-wrap:wrap;}
    .row .btn{flex:0 0 auto;}
    .row input{min-width:0;}

    .timeline-item{flex-wrap:wrap;}
    .timeline-item label{flex:0 0 100%;margin-bottom:2px;}
    .timeline-item input{flex:1 1 auto;min-width:0;}
    .timeline-item .btn{flex:0 0 auto;padding:8px 10px;font-size:12px;}

    .three-vals{gap:4px;}
    .three-vals input{padding:8px 4px;font-size:14px;}

    .med-row input{min-width:0;}

    .fixed-actions{padding:8px 10px;gap:8px;}
    .fixed-actions .btn{padding:10px 8px;font-size:12px;}

    .toggle-btn{font-size:11px;padding:5px 8px;}
  }
</style>
</head>
<body>

<header>
  <h1>静脈瘤治療記録</h1>
  <span class="meta" id="clockNow"></span>
</header>

<div class="wrap">

  <!-- 基本情報 -->
  <div class="card">
    <h2>基本情報</h2>
    <div class="grid">
      <div class="field"><label>患者ID</label><input type="text" id="patientId"></div>
      <div class="field"><label>性別</label><input type="text" id="sex" placeholder="男 / 女"></div>
      <div class="field"><label>年齢</label><input type="number" id="age"></div>
      <div class="field"><label>治療日</label><input type="text" id="treatDate" placeholder="2026/07/20"></div>
    </div>
    <div class="grid" style="margin-top:10px;">
      <div class="field" style="grid-column:1/-1;"><label>名前</label><input type="text" id="patientName"></div>
    </div>
    <div class="grid" style="margin-top:10px;">
      <div class="field">
        <label>入室時間</label>
        <div class="row">
          <input type="time" id="entryTime">
          <button class="btn btn-accent" onclick="setNow('entryTime')">現在時刻</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 入室時バイタル -->
  <div class="card">
    <h2>バイタル(入室時)</h2>
    <div class="grid">
      <div class="field"><label>BP 収縮期</label><input type="number" id="bp1Sys" placeholder="mmHg"></div>
      <div class="field"><label>BP 拡張期</label><input type="number" id="bp1Dia" placeholder="mmHg"></div>
      <div class="field"><label>P(脈拍) 回/分</label><input type="number" id="p1"></div>
      <div class="field"><label>SpO2 %</label><input type="number" id="spo21"></div>
    </div>
  </div>

  <!-- 薬剤 -->
  <div class="card">
    <h2>薬剤 <button class="btn btn-outline toggle-btn" onclick="addMed()">＋ 追加</button></h2>
    <div id="medList"></div>
  </div>

  <!-- ファイバー・神経 -->
  <div class="card">
    <h2>ファイバー / 神経ブロック</h2>
    <div class="grid">
      <div class="field"><label>ファイバー種類</label><input type="text" id="fiberType" placeholder="例: スリム(ヒ)"></div>
    </div>
    <div class="side-split" style="margin-top:10px;">
      <div class="side left">
        <h3>神経(右)</h3>
        <div class="three-vals">
          <input type="number" id="nerveR1">
          <input type="number" id="nerveR2">
          <input type="number" id="nerveR3">
        </div>
      </div>
      <div class="side right">
        <h3>神経(左)</h3>
        <div class="three-vals">
          <input type="number" id="nerveL1">
          <input type="number" id="nerveL2">
          <input type="number" id="nerveL3">
        </div>
      </div>
    </div>
  </div>

  <!-- GSV -->
  <div class="card">
    <h2>
      GSVデータ
      <button class="btn btn-ghost toggle-btn" onclick="toggleSection('gsvBody')">開閉</button>
    </h2>
    <div class="collapsible-body open" id="gsvBody">
      <div class="side-split">
        <div class="side left">
          <h3>左</h3>
          <div class="grid">
            <div class="field"><label>左GSV</label><input type="number" id="gsvL"></div>
            <div class="field"><label>膝下(cm)</label><input type="number" id="kneeL"></div>
          </div>
        </div>
        <div class="side right">
          <h3>右</h3>
          <div class="grid">
            <div class="field"><label>右GSV</label><input type="number" id="gsvR"></div>
            <div class="field"><label>膝下(cm)</label><input type="number" id="kneeR"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 施行時間 -->
  <div class="card">
    <h2>施行時間</h2>
    <div class="side-split">
      <div class="side left">
        <h3>左</h3>
        <div id="timelineL"></div>
      </div>
      <div class="side right">
        <h3>右</h3>
        <div id="timelineR"></div>
      </div>
    </div>
  </div>

  <!-- レーザー出力 -->
  <div class="card">
    <h2>レーザー出力</h2>
    <div class="side-split">
      <div class="side left">
        <h3>左</h3>
        <div class="grid">
          <div class="field"><label>W (1)</label><input type="number" step="0.1" id="laserL_w1" value="6.0"></div>
          <div class="field"><label>J (1)</label><input type="number" id="laserL_j1"></div>
          <div class="field"><label>W (2)</label><input type="number" step="0.1" id="laserL_w2" value="3.0"></div>
          <div class="field"><label>J (2)</label><input type="number" id="laserL_j2"></div>
        </div>
      </div>
      <div class="side right">
        <h3>右</h3>
        <div class="grid">
          <div class="field"><label>W (1)</label><input type="number" step="0.1" id="laserR_w1" value="6.0"></div>
          <div class="field"><label>J (1)</label><input type="number" id="laserR_j1"></div>
          <div class="field"><label>W (2)</label><input type="number" step="0.1" id="laserR_w2" value="3.0"></div>
          <div class="field"><label>J (2)</label><input type="number" id="laserR_j2"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 補足 -->
  <div class="card">
    <h2>補足</h2>
    <textarea id="notes" placeholder="特記事項があれば入力"></textarea>
  </div>

  <!-- 退室時バイタル -->
  <div class="card">
    <h2>バイタル(退室時) / TLA総量</h2>
    <div class="grid">
      <div class="field"><label>BP 収縮期</label><input type="number" id="bp2Sys"></div>
      <div class="field"><label>BP 拡張期</label><input type="number" id="bp2Dia"></div>
      <div class="field"><label>P 回/分</label><input type="number" id="p2"></div>
      <div class="field"><label>SpO2 %</label><input type="number" id="spo22"></div>
      <div class="field"><label>TLA総量(mL)</label><input type="number" id="tlaTotal"></div>
    </div>
  </div>

  <!-- 記録一覧 -->
  <div class="card">
    <h2>保存済み記録一覧</h2>
    <div class="records-list" id="recordsList"></div>
  </div>

</div>

<div class="fixed-actions">
  <button class="btn btn-outline" onclick="window.print()">印刷</button>
  <button class="btn btn-outline" onclick="newRecord()">新規</button>
  <button class="btn btn-accent" onclick="saveRecord()">保存</button>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------- 永続化(localStorageベースの自作実装) ---------- */
const STORAGE_KEY = "vein-treatment-record:v1";

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : { records: [] };
  }catch(e){
    console.error("loadState error", e);
    return { records: [] };
  }
}

function saveState(data){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    return true;
  }catch(e){
    console.error("saveState error", e);
    return false;
  }
}

/* ---------- ユーティリティ ---------- */
function pad(n){ return n.toString().padStart(2,"0"); }
function nowHHMM(){
  const d = new Date();
  return pad(d.getHours())+":"+pad(d.getMinutes());
}
function setNow(id){
  document.getElementById(id).value = nowHHMM();
}
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 1600);
}
function toggleSection(id){
  document.getElementById(id).classList.toggle("open");
}
function updateClock(){
  document.getElementById("clockNow").textContent = nowHHMM();
}
setInterval(updateClock, 1000*10);
updateClock();

/* ---------- 薬剤リスト ---------- */
let medIdSeq = 0;
function addMed(name){
  medIdSeq++;
  const id = "med_"+medIdSeq;
  const wrap = document.createElement("div");
  wrap.className = "med-row";
  wrap.id = id;
  wrap.innerHTML = `
    <input type="text" placeholder="薬剤名" value="${name ? escapeHtml(name) : ""}">
    <button class="btn btn-danger" onclick="document.getElementById('${id}').remove()">✕</button>
  `;
  document.getElementById("medList").appendChild(wrap);
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function getMeds(){
  return Array.from(document.querySelectorAll("#medList .med-row input")).map(i=>i.value).filter(v=>v.trim()!=="");
}

/* ---------- 施行タイムライン ---------- */
const TIMELINE_STEPS = ["穿刺","TLA開始","TLA終了","レーザー開始","レーザー終了"];
function buildTimeline(container, side){
  TIMELINE_STEPS.forEach((label,i)=>{
    const id = "tl_"+side+"_"+i;
    const row = document.createElement("div");
    row.className = "timeline-item";
    row.innerHTML = `
      <label>${label}</label>
      <input type="time" id="${id}">
      <button class="btn btn-accent" onclick="setNow('${id}')">現在時刻</button>
    `;
    container.appendChild(row);
  });
}
buildTimeline(document.getElementById("timelineL"), "L");
buildTimeline(document.getElementById("timelineR"), "R");

/* ---------- フォーム ⇔ データ ---------- */
function collectForm(){
  const data = {
    patientId: val("patientId"), sex: val("sex"), age: val("age"), treatDate: val("treatDate"),
    patientName: val("patientName"), entryTime: val("entryTime"),
    bp1Sys: val("bp1Sys"), bp1Dia: val("bp1Dia"), p1: val("p1"), spo21: val("spo21"),
    meds: getMeds(),
    fiberType: val("fiberType"),
    nerveR: [val("nerveR1"),val("nerveR2"),val("nerveR3")],
    nerveL: [val("nerveL1"),val("nerveL2"),val("nerveL3")],
    gsvL: val("gsvL"), kneeL: val("kneeL"), gsvR: val("gsvR"), kneeR: val("kneeR"),
    timelineL: TIMELINE_STEPS.map((_,i)=>val("tl_L_"+i)),
    timelineR: TIMELINE_STEPS.map((_,i)=>val("tl_R_"+i)),
    laserL: [val("laserL_w1"),val("laserL_j1"),val("laserL_w2"),val("laserL_j2")],
    laserR: [val("laserR_w1"),val("laserR_j1"),val("laserR_w2"),val("laserR_j2")],
    notes: val("notes"),
    bp2Sys: val("bp2Sys"), bp2Dia: val("bp2Dia"), p2: val("p2"), spo22: val("spo22"), tlaTotal: val("tlaTotal"),
    savedAt: new Date().toISOString()
  };
  return data;
}
function val(id){ const el=document.getElementById(id); return el ? el.value : ""; }
function setVal(id,v){ const el=document.getElementById(id); if(el) el.value = v ?? ""; }

function applyRecord(data){
  setVal("patientId", data.patientId); setVal("sex", data.sex); setVal("age", data.age); setVal("treatDate", data.treatDate);
  setVal("patientName", data.patientName); setVal("entryTime", data.entryTime);
  setVal("bp1Sys", data.bp1Sys); setVal("bp1Dia", data.bp1Dia); setVal("p1", data.p1); setVal("spo21", data.spo21);
  document.getElementById("medList").innerHTML = "";
  (data.meds||[]).forEach(m=>addMed(m));
  setVal("fiberType", data.fiberType);
  (data.nerveR||[]).forEach((v,i)=>setVal("nerveR"+(i+1), v));
  (data.nerveL||[]).forEach((v,i)=>setVal("nerveL"+(i+1), v));
  setVal("gsvL", data.gsvL); setVal("kneeL", data.kneeL); setVal("gsvR", data.gsvR); setVal("kneeR", data.kneeR);
  (data.timelineL||[]).forEach((v,i)=>setVal("tl_L_"+i, v));
  (data.timelineR||[]).forEach((v,i)=>setVal("tl_R_"+i, v));
  if(data.laserL){ setVal("laserL_w1",data.laserL[0]); setVal("laserL_j1",data.laserL[1]); setVal("laserL_w2",data.laserL[2]); setVal("laserL_j2",data.laserL[3]); }
  if(data.laserR){ setVal("laserR_w1",data.laserR[0]); setVal("laserR_j1",data.laserR[1]); setVal("laserR_w2",data.laserR[2]); setVal("laserR_j2",data.laserR[3]); }
  setVal("notes", data.notes);
  setVal("bp2Sys", data.bp2Sys); setVal("bp2Dia", data.bp2Dia); setVal("p2", data.p2); setVal("spo22", data.spo22); setVal("tlaTotal", data.tlaTotal);
}

/* ---------- 保存・一覧 ---------- */
function saveRecord(){
  const state = loadState();
  const data = collectForm();
  data.id = data.patientId ? (data.patientId+"_"+(data.treatDate||"")) : ("rec_"+Date.now());
  const idx = state.records.findIndex(r=>r.id===data.id);
  if(idx>=0){ state.records[idx] = data; } else { state.records.unshift(data); }
  const ok = saveState(state);
  showToast(ok ? "保存しました" : "保存に失敗しました");
  renderRecordsList();
}
function newRecord(){
  if(!confirm("現在の入力内容をクリアして新規記録を開始しますか?")) return;
  document.querySelectorAll("input[type=text], input[type=number], input[type=time], textarea").forEach(el=>el.value="");
  document.getElementById("medList").innerHTML = "";
  setVal("laserL_w1","6.0"); setVal("laserL_w2","3.0");
  setVal("laserR_w1","6.0"); setVal("laserR_w2","3.0");
  showToast("新規記録を開始しました");
}
function renderRecordsList(){
  const state = loadState();
  const listEl = document.getElementById("recordsList");
  listEl.innerHTML = "";
  if(!state.records.length){
    listEl.innerHTML = `<div class="rec"><span>まだ保存された記録はありません</span></div>`;
    return;
  }
  state.records.forEach(r=>{
    const div = document.createElement("div");
    div.className = "rec";
    div.innerHTML = `
      <span>${escapeHtml(r.patientName||"(名前未入力)")} <small>ID: ${escapeHtml(r.patientId||"-")} / ${escapeHtml(r.treatDate||"-")}</small></span>
      <span>読込 ›</span>
    `;
    div.onclick = ()=>{ applyRecord(r); showToast("読み込みました"); window.scrollTo(0,0); };
    listEl.appendChild(div);
  });
}

/* ---------- 初期化 ---------- */
addMed("カロナール");
renderRecordsList();
</script>
</body>
</html>
