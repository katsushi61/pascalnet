<!DOCTYPE html>
<!--
  App: evla-animation
  Created: 2026-08-18
  Description: 下肢静脈瘤に対する血管内レーザー焼灼術（EVLA）の患者説明用アニメーション。足首からのファイバー挿入、TLA麻酔による血管圧排、SFJからの焼灼・引き抜き、閉塞完了までの4段階を下肢全体図と血管拡大図で同時に表示する。
-->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>下肢静脈瘤 血管内レーザー焼灼術（EVLA）— 足首〜鼠蹊部</title>
<style>
  :root{
    --bg:#f2f0ec; --panel:#fff; --ink:#1b2430; --sub:#5d6b7a; --line:#dcd8d2;
    --vein:#9dc3e6; --vein-d:#5a8fc2; --deep:#3f6ea8;
    --tissue:#f4a58a; --laser:#ff3b30; --glow:#ffd166; --occl:#b0416b;
    --tla:#cfe8f5; --fiber:#3a3f4a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;}
  .wrap{max-width:820px;margin:0 auto;padding:16px 14px 44px;}
  h1{font-size:19px;font-weight:800;margin:4px 0 3px;letter-spacing:.01em;}
  .lede{font-size:12.5px;color:var(--sub);margin:0 0 12px;line-height:1.55;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    overflow:hidden;box-shadow:0 8px 26px -18px rgba(30,40,60,.4);}
  .scenes{display:flex;background:linear-gradient(180deg,#fdfcfb,#f7f4f1);}
  .scene{flex:1;min-width:0;}
  .scene svg{display:block;width:100%;height:auto;}
  .divider{width:1px;background:var(--line);}
  .cap{border-top:1px solid var(--line);padding:14px 16px 16px;}
  .badge{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;
    border-radius:50%;background:var(--laser);color:#fff;font-size:12px;font-weight:800;margin-right:8px;vertical-align:-4px;}
  .cap h2{display:inline;font-size:16.5px;font-weight:800;}
  .cap p{font-size:13px;line-height:1.7;color:#33404e;margin:8px 0 0;}
  .track{display:flex;gap:6px;margin-top:13px;}
  .track button{flex:1;height:7px;border:0;padding:0;border-radius:4px;background:var(--line);cursor:pointer;transition:.3s;}
  .track button.done{background:#b7a99d;} .track button.active{background:var(--laser);}
  .ctrl{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
  .ctrl button{font:inherit;font-size:13px;font-weight:700;cursor:pointer;border:1px solid var(--line);
    background:#fff;color:var(--ink);padding:9px 15px;border-radius:10px;transition:.15s;}
  .ctrl button.primary{background:var(--ink);color:#fff;border-color:var(--ink);}
  .ctrl button:hover{border-color:#a99c90;}
  .ctrl button:focus-visible{outline:3px solid #f7b3ad;outline-offset:2px;}
  .steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .steps button{font-size:11.5px;padding:7px 10px;color:var(--sub);}
  .steps button.on{background:var(--laser);border-color:var(--laser);color:#fff;}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:11px;color:var(--sub);}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;}
  .hint{font-size:11px;color:var(--sub);margin-top:12px;line-height:1.55;}
  @media(max-width:560px){ h1{font-size:17px} }
</style>
</head>
<body>
<div class="wrap">
  <h1>下肢静脈瘤 血管内レーザー焼灼術（EVLA）</h1>
  <p class="lede">足首から穿刺し、ファイバーを鼠蹊部（伏在大腿接合部＝SFJの直下）まで進めたのち、照射しながら足首まで引き抜きます。左：下肢を内側から見た図／右：血管の拡大像。</p>

  <div class="card">
    <div class="scenes">
      <!-- ================= LEG (medial view) ================= -->
      <div class="scene">
      <svg id="leg" viewBox="0 0 210 560" role="img" aria-label="下肢を内側から見た図">
        <defs>
          <linearGradient id="skinG" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#fbe6dc"/><stop offset=".55" stop-color="#f6d3c2"/><stop offset="1" stop-color="#eebfa9"/>
          </linearGradient>
          <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
        </defs>

        <!-- medial profile: bulky thigh, slender calf, anatomic foot (toes left) -->
        <path d="M82 30
                 C78 90 84 170 90 240
                 C94 270 96 290 98 320
                 C100 360 102 410 104 450
                 C105 468 104 484 102 496
                 C98 506 88 514 72 520
                 C58 525 44 528 34 532
                 C27 535 25 541 32 544
                 C44 548 62 547 76 542
                 C88 541 94 537 102 536
                 C111 535 118 537 124 540
                 C133 544 139 536 136 523
                 C134 511 128 504 126 494
                 C126 480 124 466 126 450
                 C132 410 142 380 144 340
                 C146 310 140 290 142 270
                 C146 200 154 110 150 30 Z"
              fill="url(#skinG)" stroke="#e0b49c" stroke-width="1.4"/>

        <!-- medial malleolus -->
        <ellipse cx="118" cy="493" rx="9" ry="8" fill="#f1c6ad" stroke="#e0b49c" stroke-width="1" opacity=".9"/>
        <!-- heel pad + arch shading -->
        <path d="M104 535 C112 534 120 536 126 539" fill="none" stroke="#e6bda6" stroke-width="1" opacity=".7"/>
        <!-- big toe nail + toe clefts -->
        <path d="M28 534 q5 -3 8 1 q-2 5 -8 3 z" fill="#f7ddcb" stroke="#dfae95" stroke-width=".8"/>
        <g stroke="#e2b49b" stroke-width=".9" fill="none" opacity=".8">
          <path d="M40 533 q3 6 1 11"/>
          <path d="M52 531 q3 6 1 11"/>
        </g>
        <!-- instep crease -->
        <path d="M96 502 q-14 10 -30 16" fill="none" stroke="#e6bda6" stroke-width="1" opacity=".6"/>

        <!-- subcutaneous plane hint -->
        <path d="M92 90 C92 200 100 300 106 400 C108 440 110 470 110 492"
              fill="none" stroke="#e6bda6" stroke-width="1" stroke-dasharray="3 4" opacity=".7"/>

        <!-- deep vein: femoral to popliteal, ending in the proximal calf -->
        <path id="deepVein" d="M126 24 C122 48 122 62 122 74
                 C124 130 130 200 128 268 C126 315 122 355 120 396"
              stroke="var(--deep)" stroke-width="7" fill="none" stroke-linecap="round" opacity=".9"/>
        <text x="146" y="392" font-size="9.5" font-weight="700" fill="#2c5686">深部静脈</text>

        <!-- tributaries joining GSV -->
        <g stroke="var(--vein-d)" stroke-width="2" fill="none" opacity=".5">
          <path d="M88 150 q10 12 15 26"/><path d="M90 250 q10 10 17 26"/>
          <path d="M96 350 q8 10 13 24"/><path d="M100 430 q6 8 10 22"/>
        </g>

        <!-- GSV: well within the subcutaneous plane, ankle to SFJ -->
        <path id="gsv" d="M118 72 C108 84 104 130 104 180 C104 240 108 270 110 310 C112 360 111 420 111 488"
              stroke="var(--vein)" stroke-width="8" fill="none" stroke-linecap="round"/>
        <path id="gsvOccl" d="M118 72 C108 84 104 130 104 180 C104 240 108 270 110 310 C112 360 111 420 111 488"
              stroke="var(--occl)" stroke-width="5" fill="none" stroke-linecap="round" opacity="0"/>
        <text x="60" y="196" font-size="9.5" font-weight="700" fill="#3e6b96">大伏在静脈</text>
        <line x1="88" y1="192" x2="102" y2="196" stroke="#3e6b96" stroke-width="1" opacity=".6"/>

        <!-- SFJ confluence -->
        <path d="M118 72 C116 64 118 58 122 58 C126 58 128 64 126 72 C124 78 120 78 118 72 Z" fill="var(--deep)" opacity=".92"/>
        <circle cx="121" cy="70" r="7" fill="none" stroke="#e0a800" stroke-width="2.4"/>
        <text x="132" y="62" font-size="10" font-weight="700" fill="#7a6100">SFJ（合流部）</text>

        <circle id="legGlow" r="12" fill="var(--laser)" filter="url(#blur6)" opacity="0"/>
        <path id="legCath" d="M118 72 C108 84 104 130 104 180 C104 240 108 270 110 310 C112 360 111 420 111 488"
              stroke="var(--fiber)" stroke-width="2.6" fill="none" stroke-linecap="round" opacity="0"/>
        <circle id="legTip" r="4" fill="#fff" stroke="var(--fiber)" stroke-width="2" opacity="0"/>

        <g id="punc" opacity="0">
          <line x1="111" y1="488" x2="82" y2="504" stroke="#8a939c" stroke-width="2.6" stroke-linecap="round"/>
          <circle cx="111" cy="488" r="4.5" fill="none" stroke="#e05353" stroke-width="2"/>
        </g>
        <text x="24" y="490" font-size="10" font-weight="700" fill="#8a4040">穿刺（足首）</text>
        <text x="126" y="512" font-size="9" font-weight="700" fill="#8a7a6a">内果</text>

        <g id="range" opacity="0">
          <line x1="172" y1="72" x2="172" y2="488" stroke="var(--laser)" stroke-width="2" stroke-dasharray="5 4"/>
          <line x1="167" y1="72" x2="177" y2="72" stroke="var(--laser)" stroke-width="2"/>
          <line x1="167" y1="488" x2="177" y2="488" stroke="var(--laser)" stroke-width="2"/>
          <text x="188" y="280" font-size="11" font-weight="800" fill="var(--laser)"
                text-anchor="middle" transform="rotate(-90 188 280)">焼灼範囲</text>
        </g>

        <text x="20" y="26" font-size="10" font-weight="700" fill="#334">▲頭側</text>
      </svg>
      </div>

      <div class="divider"></div>

      <!-- ================= CLOSE-UP ================= -->
      <div class="scene">
      <svg id="zoom" viewBox="0 0 250 560" role="img" aria-label="血管拡大図">
        <defs>
          <linearGradient id="tisG" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#f7c3ab"/><stop offset=".5" stop-color="#f4a58a"/><stop offset="1" stop-color="#f7c3ab"/>
          </linearGradient>
          <linearGradient id="veinG" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#7fb0dd"/><stop offset=".38" stop-color="#d5e9f7"/>
            <stop offset=".72" stop-color="#9dc3e6"/><stop offset="1" stop-color="#6f9fcd"/>
          </linearGradient>
          <linearGradient id="occlG" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#8e2f56"/><stop offset=".4" stop-color="#d4638c"/><stop offset="1" stop-color="#9c3760"/>
          </linearGradient>
          <filter id="glowF"><feGaussianBlur stdDeviation="7"/></filter>
          <filter id="glowS"><feGaussianBlur stdDeviation="2.5"/></filter>
          <clipPath id="occlClip"><rect id="occlRect" x="0" y="40" width="250" height="0"/></clipPath>
          <clipPath id="tlaClip"><rect id="tlaRect" x="0" y="520" width="250" height="0"/></clipPath>
        </defs>

        <rect x="62" y="30" width="126" height="500" rx="18" fill="url(#tisG)" opacity=".55"/>
        <rect x="62" y="30" width="126" height="500" rx="18" fill="none" stroke="#eba98f" opacity=".5"/>

        <!-- TLA halo (revealed bottom-up), stays full width = perivenous infiltration -->
        <g clip-path="url(#tlaClip)">
          <rect x="66" y="30" width="118" height="500" rx="16" fill="var(--tla)" opacity=".75"/>
        </g>

        <!-- vein group is horizontally compressed after TLA -->
        <g id="veinGroup">
          <path id="veinWall"
            d="M96 44 C86 100 104 150 92 206 C82 258 104 306 94 360 C86 412 104 458 96 516
               L154 516 C146 458 164 412 156 360 C146 306 168 258 158 206 C146 150 164 100 154 44 Z"
            fill="url(#veinG)" stroke="#6f9fcd" stroke-width="1.6"/>
          <g clip-path="url(#occlClip)">
            <path id="occlWall"
              d="M114 44 C110 100 118 150 112 206 C108 258 118 306 114 360 C110 412 118 458 114 516
                 L136 516 C132 458 140 412 136 360 C132 306 142 258 138 206 C132 150 140 100 136 44 Z"
              fill="url(#occlG)" stroke="#8e2f56" stroke-width="1.4"/>
          </g>
          <g id="flow"></g>
        </g>

        <!-- catheter / fiber (centerline, unscaled) -->
        <line id="cath" x1="125" y1="560" x2="125" y2="560" stroke="var(--fiber)" stroke-width="4.4" stroke-linecap="round"/>
        <line id="cathCore" x1="125" y1="560" x2="125" y2="560" stroke="#8b93a0" stroke-width="1.6" stroke-linecap="round"/>

        <g id="laserG" opacity="0">
          <circle id="halo" cx="125" cy="500" r="26" fill="var(--laser)" filter="url(#glowF)" opacity=".55"/>
          <circle id="core" cx="125" cy="500" r="7" fill="var(--glow)" filter="url(#glowS)"/>
        </g>
        <g id="bubbles"></g>
        <line x1="125" y1="516" x2="125" y2="552" stroke="#8a939c" stroke-width="3" stroke-linecap="round"/>

        <text x="197" y="52" font-size="10.5" font-weight="700" fill="#7a5a4a">周囲組織</text>
        <text x="18" y="52" font-size="10.5" font-weight="700" fill="#3e6b96">大伏在静脈</text>
        <text id="tlaLabel" x="14" y="300" font-size="10.5" font-weight="700" fill="#2f6d8c" opacity="0">TLA麻酔</text>
      </svg>
      </div>
    </div>

    <div class="cap">
      <span class="badge" id="badge">1</span><h2 id="capTitle">穿刺・ファイバー挿入</h2>
      <p id="capText"></p>
      <div class="track" id="track"></div>
      <div class="ctrl">
        <button class="primary" id="playBtn">⏸ 一時停止</button>
        <button id="replayBtn">↻ 最初から</button>
      </div>
      <div class="steps" id="steps"></div>
      <div class="legend">
        <span><i style="background:var(--vein)"></i>大伏在静脈</span>
        <span><i style="background:var(--tla)"></i>TLA麻酔</span>
        <span><i style="background:var(--laser)"></i>レーザー照射</span>
        <span><i style="background:var(--occl)"></i>閉塞・線維化</span>
      </div>
      <p class="hint">足首穿刺のため下腿では伏在神経が静脈に近接します。TLA麻酔で血管を圧排・細径化し、周囲組織と神経を熱から保護します。</p>
    </div>
  </div>
</div>

<script>
(function(){
  const SVG="http://www.w3.org/2000/svg", $=id=>document.getElementById(id);
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const TOP=44, BOT=516;
  const gsvPath=$("gsv"), L=gsvPath.getTotalLength();

  const steps=[
    {t:"穿刺・ファイバー挿入",
     d:"超音波ガイド下に足首の大伏在静脈を穿刺し、シースを留置。レーザーファイバーを血管内に挿入し、足首から鼠蹊部へ向けて進めます。"},
    {t:"先端の位置決め・TLA麻酔",
     d:"ファイバー先端をSFJ（伏在大腿接合部）の直下に留置し、超音波で確認。血管周囲にTLA麻酔を注入すると、静脈は圧排されて細くなり、周囲組織と神経が熱から守られます。"},
    {t:"レーザー照射・引き抜き",
     d:"レーザーを照射しながら、鼠蹊部から足首へ一定速度でファイバーを引き抜きます。熱と水蒸気で静脈壁が収縮し、内腔が閉じていきます。"},
    {t:"閉塞完了・血流の転換",
     d:"焼灼した大伏在静脈は足首から鼠蹊部まで全長にわたり閉塞し、線維化して索状に吸収されます。血液は深部静脈へ流れ、逆流とうっ滞が解消します。"}
  ];

  const flowG=$("flow"), arrows=[];
  for(let i=0;i<5;i++){
    const p=document.createElementNS(SVG,"path");
    p.setAttribute("fill","#e23b47"); p.setAttribute("opacity",".85");
    flowG.appendChild(p); arrows.push({el:p,t:i/5});
  }
  function drawArrow(el,x,y,up){ const s=6,d=up?-1:1;
    el.setAttribute("d",`M${x-s} ${y+s*d} L${x} ${y-s*1.3*d} L${x+s} ${y+s*d} Z`); }

  const bubG=$("bubbles"), bubs=[];
  for(let i=0;i<14;i++){ const c=document.createElementNS(SVG,"circle");
    c.setAttribute("fill","#fff"); c.setAttribute("opacity","0"); bubG.appendChild(c);
    bubs.push({el:c, ph:Math.random(), ox:(Math.random()-.5)*22, sp:.5+Math.random()*.8}); }

  let cur=0, playing=!reduce, t0=performance.now();
  const DUR=[4200,4600,7000,4600];

  function setStep(i){
    cur=i; t0=performance.now();
    $("badge").textContent=i+1; $("capTitle").textContent=steps[i].t; $("capText").textContent=steps[i].d;
    [...$("track").children].forEach((b,k)=>b.className=k<i?"done":(k===i?"active":""));
    [...$("steps").children].forEach((b,k)=>b.classList.toggle("on",k===i));
    $("punc").setAttribute("opacity",1);
    $("range").setAttribute("opacity", i>=2?1:0);
  }
  steps.forEach((s,i)=>{
    const b=document.createElement("button"); b.onclick=()=>setStep(i);
    b.setAttribute("aria-label",`手順${i+1} ${s.t}`); $("track").appendChild(b);
    const sb=document.createElement("button"); sb.textContent=`${i+1}. ${s.t.split("・")[0]}`;
    sb.onclick=()=>setStep(i); $("steps").appendChild(sb);
  });
  $("playBtn").onclick=()=>{ playing=!playing; $("playBtn").textContent=playing?"⏸ 一時停止":"▶ 再生"; if(playing) t0=performance.now(); };
  $("replayBtn").onclick=()=>{ setStep(0); playing=true; $("playBtn").textContent="⏸ 一時停止"; };
  if(reduce) $("playBtn").textContent="▶ 再生";
  const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;

  function frame(now){
    const el=now-t0, p=Math.min(1, el/DUR[cur]), e=ease(p);
    let tipY=BOT, laserOn=false, occlH=0, tlaH=0, sx=1;

    if(cur===0){ tipY = BOT + (TOP+14-BOT)*e; }
    else if(cur===1){ tipY=TOP+14; tlaH=e*490; sx = 1 - 0.45*e; }
    else if(cur===2){ tipY=(TOP+14)+(BOT-(TOP+14))*e; laserOn=true; tlaH=490; sx=0.55-0.03*e; occlH=tipY-40; }
    else { tipY=BOT+50; occlH=490; tlaH=490*(1-e*0.85); sx=0.46; }

    // vein compression after TLA
    $("veinGroup").setAttribute("transform",`translate(125 0) scale(${sx.toFixed(3)} 1) translate(-125 0)`);

    $("cath").setAttribute("y1",560); $("cath").setAttribute("y2",tipY);
    $("cathCore").setAttribute("y1",560); $("cathCore").setAttribute("y2",tipY);
    $("occlRect").setAttribute("height",Math.max(0,occlH));
    $("tlaRect").setAttribute("y",530-tlaH); $("tlaRect").setAttribute("height",tlaH);
    $("tlaLabel").setAttribute("opacity", (cur===1||cur===2)?0.95:0);

    $("laserG").setAttribute("opacity", laserOn?1:0);
    if(laserOn){ const pulse=1+Math.sin(now/90)*0.13;
      $("halo").setAttribute("cy",tipY); $("core").setAttribute("cy",tipY);
      $("halo").setAttribute("r",(24*pulse).toFixed(1)); $("core").setAttribute("r",(6.5*pulse).toFixed(1)); }
    bubs.forEach(b=>{ if(!laserOn){ b.el.setAttribute("opacity",0); return; }
      b.ph+=0.012*b.sp; if(b.ph>1)b.ph-=1;
      b.el.setAttribute("cx",125+b.ox*(0.4+b.ph)); b.el.setAttribute("cy",tipY-b.ph*70);
      b.el.setAttribute("r",(1.6+b.ph*3.2).toFixed(1)); b.el.setAttribute("opacity",(0.85*(1-b.ph)).toFixed(2)); });

    arrows.forEach(a=>{ a.t+=0.0035; if(a.t>1)a.t-=1; const y=60+a.t*440;
      const hidden=(cur>=2 && y<tipY)||cur===3;
      if(hidden){ a.el.setAttribute("opacity",0); return; }
      a.el.setAttribute("opacity",.8); drawArrow(a.el,143,y,false); });

    // leg panel
    const tipLen=(cur===0)?L*(1-e):(cur===1)?0:(cur===2)?L*e:L;
    if(cur<3){
      $("legCath").setAttribute("opacity",1);
      $("legCath").setAttribute("stroke-dasharray",`${L-tipLen} ${L}`);
      $("legCath").setAttribute("stroke-dashoffset", -(tipLen));
      const pt=gsvPath.getPointAtLength(tipLen);
      $("legTip").setAttribute("cx",pt.x); $("legTip").setAttribute("cy",pt.y); $("legTip").setAttribute("opacity",1);
      if(cur===2){ $("legGlow").setAttribute("cx",pt.x); $("legGlow").setAttribute("cy",pt.y); $("legGlow").setAttribute("opacity",.85); }
      else $("legGlow").setAttribute("opacity",0);
    } else { $("legCath").setAttribute("opacity",0); $("legTip").setAttribute("opacity",0); $("legGlow").setAttribute("opacity",0); }
    const oc=(cur===2)?L*e:(cur===3?L:0);
    $("gsvOccl").setAttribute("opacity", oc>0?1:0);
    $("gsvOccl").setAttribute("stroke-dasharray",`${oc} ${L}`);
    $("gsvOccl").setAttribute("stroke-width", cur===3?3.4:5);

    if(playing && p>=1) setStep((cur+1)%steps.length);
    requestAnimationFrame(frame);
  }
  setStep(0); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
