// ============================================================
// window.storage ポリフィル（localStorage を使った永続化）
// 元のコードは Claude.ai アーティファクト専用の window.storage API に
// 依存しているため、単体配布用にブラウザの localStorage で実装する。
// ============================================================
window.storage = {
  async get(key) {
    try {
      const raw = localStorage.getItem("rxapp:" + key);
      return raw === null ? null : { value: raw };
    } catch (e) {
      return null;
    }
  },
  async set(key, value) {
    try {
      localStorage.setItem("rxapp:" + key, value);
      return true;
    } catch (e) {
      return false;
    }
  },
  async delete(key) {
    try {
      localStorage.removeItem("rxapp:" + key);
    } catch (e) {}
  },
};

// ---------- 文字正規化(検索用) ----------
const toKatakana = s => s.replace(/[ぁ-ゖ]/g, ch => String.fromCharCode(ch.charCodeAt(0) + 0x60));
const normalize = s => {
  if (!s) return "";
  let t = String(s).normalize("NFKC").toLowerCase();
  t = toKatakana(t);
  return t.replace(/\s+/g, "");
};

// ---------- 厚労省マスターのヘッダー検出 ----------
const HEADER_PATTERNS = {
  code: /コード/,
  ingredient: /成分/,
  spec: /規格/,
  name: /品名/,
  maker: /メーカー|会社/,
  price: /薬価/,
  genericInfo: /後発|有無/
};
function detectColumns(rows) {
  for (let r = 0; r < Math.min(rows.length, 20); r++) {
    const row = rows[r] || [];
    const joined = row.map(c => String(c ?? "")).join("|");
    if (/品名/.test(joined) && /薬価/.test(joined)) {
      const cols = {};
      row.forEach((cell, i) => {
        const text = String(cell ?? "");
        for (const [key, pat] of Object.entries(HEADER_PATTERNS)) {
          if (cols[key] === undefined && pat.test(text)) cols[key] = i;
        }
      });
      if (cols.name !== undefined) return {
        headerRow: r,
        cols
      };
    }
  }
  return null;
}

// シート名から剤形区分を推定
function sheetCategory(name) {
  if (/内用/.test(name)) return "内用";
  if (/注射/.test(name)) return "注射";
  if (/外用/.test(name)) return "外用";
  if (/歯科/.test(name)) return "歯科";
  return "";
}
function parseWorkbook(wb) {
  const items = [];
  const parsedSheets = [];
  for (const sheetName of wb.SheetNames) {
    const ws = wb.Sheets[sheetName];
    if (!ws) continue;
    const rows = XLSX.utils.sheet_to_json(ws, {
      header: 1,
      defval: ""
    });
    const det = detectColumns(rows);
    if (!det) continue;
    const {
      headerRow,
      cols
    } = det;
    const cat = sheetCategory(sheetName);
    let count = 0;
    for (let r = headerRow + 1; r < rows.length; r++) {
      const row = rows[r];
      if (!row) continue;
      const name = String(row[cols.name] ?? "").trim();
      if (!name) continue;
      const item = {
        name,
        spec: cols.spec !== undefined ? String(row[cols.spec] ?? "").trim() : "",
        ingredient: cols.ingredient !== undefined ? String(row[cols.ingredient] ?? "").trim() : "",
        maker: cols.maker !== undefined ? String(row[cols.maker] ?? "").trim() : "",
        price: cols.price !== undefined ? String(row[cols.price] ?? "").trim() : "",
        code: cols.code !== undefined ? String(row[cols.code] ?? "").trim() : "",
        gen: cols.genericInfo !== undefined ? String(row[cols.genericInfo] ?? "").trim() : "",
        cat
      };
      item.key = normalize(item.name + item.ingredient);
      items.push(item);
      count++;
    }
    if (count > 0) parsedSheets.push(`${sheetName}(${count})`);
  }
  return {
    items,
    parsedSheets
  };
}

function localSuggest(qn) {
  if (!qn) return null;
  for (const e of LOCAL_RX_DB) {
    if (e.match.some(m => {
      const mn = normalize(m);
      return qn.includes(mn) || mn.includes(qn);
    })) return e.items;
  }
  return null;
}

// 規格から単位を推定
function guessUnit(spec, cat) {
  const s = spec || "";
  if (/カプセル/.test(s)) return "カプセル";
  if (/錠/.test(s)) return "錠";
  if (/シロップ|内用液|液/.test(s) && /mL|ｍＬ/.test(s)) return "mL";
  if (/散|細粒|顆粒|ドライシロップ/.test(s)) return "g";
  if (/キット|シリンジ|筒|管|瓶|バイアル|アンプル/.test(s)) return "本";
  if (/貼付|テープ|パップ/.test(s)) return "枚";
  if (/坐剤/.test(s)) return "個";
  if (cat === "注射") return "本";
  return "錠";
}
function genId() {
  return Math.random().toString(36).slice(2, 9);
}
function todayStr() {
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

// ---------- 永続化 (window.storage) ----------
async function storageGet(key) {
  try {
    if (!window.storage) return null;
    const r = await window.storage.get(key);
    return r ? JSON.parse(r.value) : null;
  } catch {
    return null;
  }
}
async function storageSet(key, value) {
  try {
    if (!window.storage) return false;
    await window.storage.set(key, JSON.stringify(value));
    return true;
  } catch {
    return false;
  }
}
async function storageDel(key) {
  try {
    if (window.storage) await window.storage.delete(key);
  } catch {}
}

  const [master, setMaster] = useState([]);
  const [masterInfo, setMasterInfo] = useState(null); // {file, sheets, savedAt}

  const [favorites, setFavorites] = useState([]);
  const [showFav, setShowFav] = useState(false);
  const [padMode, setPadMode] = useState(false);
  const [favQuery, setFavQuery] = useState("");
  const [aiQuery, setAiQuery] = useState("");
  const [aiLoading, setAiLoading] = useState(false);
  const [aiCandidates, setAiCandidates] = useState([]);
  const fileRef = useRef(null);
  const toastTimer = useRef(null);
  const notify = useCallback((msg, kind = "ok") => {
    setToast({
      msg,
      kind
    });
    if (toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 3200);
  }, []);

  // 起動時: 保存済みマスター・お気に入りを復元
  useEffect(() => {
    (async () => {
      const fav = await storageGet("rx-favorites");
      if (Array.isArray(fav) && fav.length > 0) {
        setFavorites(fav);
      } else {
        // 保存済みデータが無ければ、あらかじめ用意した「よく使う処方」を初期値にする
        setFavorites(window.DEFAULT_FAVORITES || []);
      }
      const pm = await storageGet("rx-pad-mode");
      if (pm === true) setPadMode(true);
      const meta = await storageGet("rx-master-meta");
      if (meta && meta.chunks) {
        try {
          let all = [];
          for (let i = 0; i < meta.chunks; i++) {
            const part = await storageGet(`rx-master-${i}`);
            if (!Array.isArray(part)) throw new Error("chunk missing");
            all = all.concat(part);
          }
          all.forEach(it => it.key = normalize(it.name + (it.ingredient || "")));
          setMaster(all);
          setMasterInfo({
            ...meta,
            restored: true
          });
        } catch {
          /* 復元失敗時は未読込のまま */
        }
      }
    })();
  }, []);

  // ---------- ファイル読み込み ----------
  const handleFile = async file => {
    if (!file) return;
    setLoading(true);
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, {
        type: "array"
      }); // xlsx は csv も読める
      const {
        items,
        parsedSheets
      } = parseWorkbook(wb);
      if (items.length === 0) {
        notify("品目を検出できませんでした。「品名」「薬価」列を含むファイルか確認してください", "err");
      } else {
