  Description: ボタンを押すと「ハローワールド!」を表示するだけのシンプルなサンプルアプリ。
-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello World アプリ</title>
<script>const CONFIG = { apiBase: "", basePath: "" };</script>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    font-family: "Helvetica Neue", Arial, sans-serif;
  }
  .card {
    background: #fff;
    padding: 48px 40px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    text-align: center;
    min-width: 280px;
  }
  button {
    padding: 14px 32px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    background: #764ba2;
    color: #fff;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.2s ease;
  }
  button:hover { background: #667eea; }
  button:active { transform: scale(0.96); }
  #message {
    margin-top: 24px;
    font-size: 24px;
    font-weight: bold;
    color: #333;
    min-height: 32px;
  }
  @media (max-width: 600px) {
    .card {
      padding: 36px 24px;
      min-width: 0;
      width: 80%;
    }
    button {
      width: 100%;
      padding: 14px 0;
      font-size: 16px;
    }
    #message {
      font-size: 20px;
    }
  }
</style>
</head>
<body>
  <div class="card">
    <button onclick="document.getElementById('message').textContent = 'ハローワールド!'">
      クリックしてね
    </button>
    <div id="message"></div>
  </div>
</body>
</html>
